name: Deploy FIBO Video Director

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-backend:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CDK
        run: |
          npm install -g aws-cdk
          pip install -r infrastructure/cdk/requirements.txt

      - name: CDK Deploy
        working-directory: infrastructure/cdk
        run: |
          cdk deploy --require-approval never --outputs-file cdk-outputs.json

      - name: Extract Backend URL
        id: backend-url
        working-directory: infrastructure/cdk
        run: |
          BACKEND_URL=$(cat cdk-outputs.json | jq -r '.FiboVideoDirectorBackend.BackendUrl')
          echo "url=$BACKEND_URL" >> $GITHUB_OUTPUT

    outputs:
      backend-url: ${{ steps.backend-url.outputs.url }}

  deploy-frontend:
    name: Deploy Frontend to Amplify
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ needs.deploy-backend.outputs.backend-url }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Amplify
        run: |
          # Create zip of build
          cd frontend/build && zip -r ../../frontend-build.zip .
          cd ../..
          
          # Deploy to Amplify (assumes app already created)
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name main \
            --source-url s3://${{ secrets.AMPLIFY_DEPLOY_BUCKET }}/frontend-build.zip || true
